<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Giuseppe Stillavato | CV</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      width:420px;
      padding:50px;
      border-radius:25px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    h1{
      font-size:36px;
      margin-bottom:10px;
    }

    h2{
      font-size:18px;
      color:#cbd5e1;
      margin-bottom:40px;
      font-weight:normal;
    }

    .button{
      display:block;
      margin:15px 0;
      padding:15px;
      background:#3b82f6;
      color:white;
      text-decoration:none;
      border-radius:14px;
      transition:0.3s;
      font-weight:bold;
    }

    .button:hover{
      background:#2563eb;
      transform:translateY(-2px);
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>Giuseppe Stillavato</h1>

    <h2>Mechanical Engineering Student</h2>

    <a class="button" href="cv_en.pdf" target="_blank">
      CV English
    </a>

    <a class="button" href="cv_it.pdf" target="_blank">
      CV Italiano
    </a>

  </div>

</body>
</html>
